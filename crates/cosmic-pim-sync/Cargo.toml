[package]
name = "cosmic-pim-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ties accounts, credentials, CalDAV, and the vdir into one sync cycle"
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cosmic-pim-core = { path = "../cosmic-pim-core" }
cosmic-pim-caldav = { path = "../cosmic-pim-caldav" }
cosmic-pim-accounts = { path = "../cosmic-pim-accounts" }
cosmic-pim-auth = { path = "../cosmic-pim-auth" }
cosmic-pim-mail = { path = "../cosmic-pim-mail" }

thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
chrono = "0.4.45"

[lints.clippy]
all = { level = "warn", priority = -1 }

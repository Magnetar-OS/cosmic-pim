[package]
name = "cosmic-pim-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ties accounts, credentials, CalDAV, and the vdir into one sync cycle"
repository.workspace = true
rust-version.workspace = true
keywords = ["caldav", "carddav", "imap", "sync", "pim"]
categories = ["network-programming", "email"]
readme = "../../README.md"

[dependencies]
cosmic-pim-core = { path = "../cosmic-pim-core", version = "2.2.0" }
cosmic-pim-caldav = { path = "../cosmic-pim-caldav", version = "2.2.0" }
cosmic-pim-accounts = { path = "../cosmic-pim-accounts", version = "2.2.0" }
cosmic-pim-auth = { path = "../cosmic-pim-auth", version = "2.2.0" }
# Optional: a contacts or calendar app has no use for IMAP, SMTP, OpenPGP or
# HTML parsing, and linking them drags pgp, rsa (RUSTSEC-2023-0071), lettre,
# imap and scraper into its graph. On by default; Circle turns it off.
cosmic-pim-mail = { path = "../cosmic-pim-mail", version = "2.2.0", optional = true }

thiserror = "2"
tracing = "0.1"

[features]
default = ["mail"]
# The mail sync pass (`mail`, `sync_account_mail`) and its outbox drain.
mail = ["dep:cosmic-pim-mail"]

[dev-dependencies]
tempfile = "3"
# A token endpoint for the sign-in test, as in `cosmic-pim-auth`, and the
# encoding of the ID token it hands out.
tiny_http = "0.12"
base64 = "0.23"
chrono = "0.4.45"

[lints.clippy]
all = { level = "warn", priority = -1 }

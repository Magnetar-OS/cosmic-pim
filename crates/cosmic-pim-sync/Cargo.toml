[package]
name = "cosmic-pim-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ties accounts, credentials, CalDAV, and the vdir into one sync cycle"
repository.workspace = true
rust-version.workspace = true
keywords = ["caldav", "carddav", "imap", "sync", "pim"]
categories = ["network-programming", "email"]
readme = "../../README.md"

[dependencies]
cosmic-pim-core = { path = "../cosmic-pim-core", version = "0.1.0" }
cosmic-pim-caldav = { path = "../cosmic-pim-caldav", version = "0.1.0" }
cosmic-pim-accounts = { path = "../cosmic-pim-accounts", version = "0.1.0" }
cosmic-pim-auth = { path = "../cosmic-pim-auth", version = "0.1.0" }
cosmic-pim-mail = { path = "../cosmic-pim-mail", version = "0.1.0" }

thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
chrono = "0.4.45"

[lints.clippy]
all = { level = "warn", priority = -1 }

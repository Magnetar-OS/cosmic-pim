[package]
name = "cosmic-pim-mail"
version.workspace = true
edition.workspace = true
# MPL-2.0 — see ../../LICENSING.md. Like cosmic-pim-caldav, parts of this crate
# derive from the Meltemi repository, which grants MPL-2.0 on the donor files
# explicitly (meltemi commit 5c14069) — sync cycle, JWZ threading, HTML-to-text,
# RFC 8601 parsing, bounce classification, and the PGP/MIME shapes.
license.workspace = true
description = "Message model, maildir store, threading, and IMAP sync for the COSMIC PIM suite"
repository.workspace = true
rust-version.workspace = true
keywords = ["imap", "maildir", "email", "jmap", "threading"]
categories = ["email", "network-programming"]
readme = "../../README.md"

[dependencies]
# Atomic writes and the Contact model a sender resolves against. The mail crate
# stands *beside* cosmic-pim-caldav rather than on it: IMAP is not a WebDAV
# flavour and shares none of its plumbing.
cosmic-pim-core = { path = "../cosmic-pim-core", version = "0.1.0" }

# The parser boundary. `mail-parser` reads; nothing here ever writes a message
# back through it — the maildir file holds the server's RFC 5322 bytes verbatim,
# exactly as the vdir holds a server's iCalendar text.
mail-parser = "0.11"

# OpenPGP (RFC 4880) and PGP/MIME (RFC 3156). Verification and decryption
# only — this crate never generates a key, so rpgp's `rand` requirement (it
# is on 0.8, a major version behind everything else here) stays out of the
# tree entirely.
pgp = "0.20"

# IMAP. `default-features = false` + `native-tls` deliberately, matching the
# donor: `imap` links native-tls and mixing TLS stacks in one binary is a
# packaging problem nobody wants. `imap-proto` is needed directly because LIST
# attributes come back as its types.
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["native-tls"] }
imap-proto = "0.16"
native-tls = "0.2"

# SMTP, and the RFC 5322 builder. `native-tls` to match `imap` — two TLS stacks
# in one binary is a packaging problem nobody wants, and it is the reason
# `imap` is on native-tls too.
lettre = { version = "0.11", default-features = false, features = [
  "smtp-transport",
  "hostname",
  "builder",
  "native-tls",
] }

# Account discovery fetches Mozilla autoconfig documents over HTTPS. Blocking,
# like the rest of this crate, and native-tls to match `imap` and `lettre` —
# three TLS stacks in one binary is a packaging problem nobody wants.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
# Streaming pull parser for those documents, the same one cosmic-pim-caldav
# uses for multistatus XML.
quick-xml = "0.42.0"

# HTML → what a human would actually see. A real html5ever tree, not a
# tag-stripper: hostile mail is precisely where parser-differential tricks live.
scraper = { version = "0.27.0", default-features = false, features = ["errors"] }
ego-tree = "0.11.0"

# The disposable index. `bundled` compiles SQLite from source so we never
# depend on the host's libsqlite3 version — the same choice cosmic-pim-core
# makes for the calendar's cache, and for the same reason.
rusqlite = { version = "0.40", features = ["bundled"] }

# Modified UTF-7 mailbox names (RFC 3501 §5.1.3) ride on base64.
base64 = "0.23"
dirs = "7"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# Filter rules are files-as-truth beside the account, and TOML is the format a
# person edits without a manual — the same reasoning as accounts.toml.
toml = "1.1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# Key generation and signing, for the PGP tests only. rpgp is on rand 0.8, a
# major version behind the rest of the tree, so it is aliased and confined to
# tests — the crate itself only ever verifies and decrypts, which needs no
# randomness at all.
rand_pgp = { package = "rand", version = "0.8" }
# A real HTTP server for the JMAP end-to-end test — the same role tiny_http
# plays for CalDAV. The IMAP and POP3 harnesses are hand-rolled because their
# protocols are not HTTP.
tiny_http = "0.12"

[lints.clippy]
all = { level = "warn", priority = -1 }

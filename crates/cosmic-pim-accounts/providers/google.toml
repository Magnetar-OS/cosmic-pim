# Google. OAuth is its own route, and the only one for Calendar and Contacts:
# a client id has to be configured before those can be reached at all.
#
# Mail alone has a second way in. An account with 2-Step Verification on can
# make an app password, and Gmail still takes one over IMAP and SMTP — which
# is what `[app_password]` below records, for an installation with no client
# id.
id = "google"
name = "Google"
hint = "Requires an OAuth client id from a Google Cloud project. See providers(5) in the docs."
domains = ["gmail.com", "googlemail.com"]

[app_password]
hint = "Turn on 2-Step Verification for your Google account, then create an app password and use it here. This adds mail only — calendar and contacts need the browser sign-in."
help_url = "https://myaccount.google.com/apppasswords"

[oauth]
auth_url = "https://accounts.google.com/o/oauth2/v2/auth"
token_url = "https://oauth2.googleapis.com/token"
redirect_port = 49173
scopes = [
    "openid",
    "email",
    "profile",
    "https://www.googleapis.com/auth/calendar",
    "https://www.googleapis.com/auth/carddav",
    # The Gmail API. `mail.google.com` is the IMAP/SMTP scope and is kept so
    # that an account switched back to IMAP needs no re-consent.
    "https://www.googleapis.com/auth/gmail.modify",
    "https://mail.google.com/",
]

[oauth.extra_params]
# Without this Google returns an access token and no refresh token, and the
# account stops working an hour later with what looks like a revoked password.
access_type = "offline"
# And without this it stops returning a refresh token on every *subsequent*
# authorisation, so re-adding a removed account yields an unrefreshable one.
prompt = "consent"

[services]
calendar = "https://apidata.googleusercontent.com/caldav/v2/"
contacts = "https://www.googleapis.com/carddav/v1/principals/{username}/"

[services.mail]
# The Gmail API rather than IMAP: archiving is the removal of the INBOX label
# and IMAP has no way to say that, so an archive performed anywhere else stays
# invisible to an IMAP client until a full-mailbox reconcile. The IMAP details
# below stay filled in, because switching back is then one field rather than
# four.
protocol = "gmail"
imap_host = "imap.gmail.com"
imap_port = 993
imap_transport = "tls"
smtp_host = "smtp.gmail.com"
smtp_port = 465
smtp_transport = "tls"

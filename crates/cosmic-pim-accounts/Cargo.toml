[package]
name = "cosmic-pim-accounts"
version.workspace = true
edition.workspace = true
# MPL-2.0 — see ../../LICENSING.md.
license.workspace = true
description = "Account metadata and credential storage for the COSMIC PIM suite"
repository.workspace = true
rust-version.workspace = true
keywords = ["keychain", "credentials", "accounts", "secret-service"]
categories = ["authentication", "os::linux-apis"]
readme = "../../README.md"

[dependencies]
cosmic-pim-core = { path = "../cosmic-pim-core", version = "0.1.0" }

# The OS keychain. On Linux this is secret-service (GNOME Keyring / KWallet).
keyring = "4.2.0"

# The envelope fallback, for hosts where the keychain is unusable. XChaCha20's
# 192-bit nonce is what makes random nonces safe here: with AES-GCM's 96 bits,
# a long-lived key plus random nonces has a birthday-bound collision risk that
# would leak plaintext.
chacha20poly1305 = "0.11.0"
zeroize = "1"
rand = "0.10"
base64 = "0.23"

# Token expiry. The same version core and every protocol crate use, so an
# `expires_at` crossing a crate boundary is one type rather than a conversion.
chrono = { version = "0.4.45", features = ["clock", "serde"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1"
uuid = { version = "1.26.0", features = ["v4"] }
dirs = "7"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }

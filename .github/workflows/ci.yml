# The gate the justfile's recipes imply, run on shared runners. The toolchain
# comes from rust-toolchain.toml — the workflow deliberately passes none, per
# the ecosystem convention, so a bump there is a bump everywhere at once.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml on the first cargo invocation and
      # installs the pinned channel with its components. No toolchain action
      # needed, and none wanted: an action pinning its own default would
      # silently override the file.
      - name: Show the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # Both file-level checks, from the same script the justfile runs, so
      # there is one copy of each rule. They read files rather than building,
      # so they run first and fail fast — and "your lock names a crate CI
      # cannot fetch" is more actionable than the build error it prevents.
      - name: Preflight — toolchain pin and lockfile
        run: ./scripts/preflight.sh

      - name: Formatting
        run: cargo fmt --all -- --check

      # Warnings as-is (the workspace's own lint tables gate the build);
      # pedantic stays advisory, as everywhere in the COSMIC ecosystem.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Tests
        run: cargo test --workspace --locked

  # The server matrix 00-suite.md asks for: the real sync engine against real
  # CalDAV servers, exercising discovery, MKCALENDAR, listing, multiget,
  # writeback, the 412 path and guarded deletes against something nobody
  # canned. Three independent codebases — Radicale (Python), Xandikos
  # (Python, unrelated), Nextcloud (sabre/dav, PHP) — which is the point: a
  # single server proves the client against one set of habits, and every leg
  # added so far has produced findings the others could not. The journey each
  # job runs is validated locally against that server, twice, before it
  # reaches CI.
  live-caldav:
    name: live CalDAV (${{ matrix.server }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `expect` is the detection outcome, not the product: two of these
          # servers volunteer no identity at all and must read as Unknown.
          # See quirks.rs's module docs for the wire evidence.
          - server: radicale
            url: http://127.0.0.1:5232/ci/
            user: ci
            pass: ci
            expect: Unknown
          - server: xandikos
            url: http://127.0.0.1:5233/ci/
            user: ""
            pass: ""
            expect: Unknown
          - server: nextcloud
            url: http://127.0.0.1:8081/remote.php/dav/
            user: ci
            pass: ci-password-1
            expect: Nextcloud
          - server: baikal
            url: http://127.0.0.1:8082/dav.php/
            user: ci
            pass: ci-password-1
            expect: Baikal
    steps:
      - uses: actions/checkout@v4
      - name: Show the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Start Radicale
        if: matrix.server == 'radicale'
        run: |
          pipx install radicale
          mkdir -p /tmp/radicale
          cat > /tmp/radicale.conf <<'EOF'
          [server]
          hosts = 127.0.0.1:5232
          [auth]
          type = none
          [storage]
          filesystem_folder = /tmp/radicale
          [rights]
          type = owner_only
          EOF
          radicale --config /tmp/radicale.conf &
          for _ in $(seq 1 50); do
            curl -s -o /dev/null http://127.0.0.1:5232/ && break
            sleep 0.2
          done

      - name: Start Xandikos
        if: matrix.server == 'xandikos'
        run: |
          pipx install xandikos
          mkdir -p /tmp/xandikos
          xandikos -d /tmp/xandikos --autocreate -l 127.0.0.1 -p 5233 \
            --current-user-principal=/ci/ &
          for _ in $(seq 1 50); do
            curl -s -o /dev/null http://127.0.0.1:5233/ && break
            sleep 0.2
          done

      # The official image installs itself from these env vars — no wizard,
      # no occ, no fixture. SQLite because the journey touches a handful of
      # events and a database container would only add a second thing to wait
      # for.
      - name: Start Nextcloud
        if: matrix.server == 'nextcloud'
        run: |
          docker run -d --name pim-nextcloud -p 127.0.0.1:8081:80 \
            -e SQLITE_DATABASE=nextcloud \
            -e NEXTCLOUD_ADMIN_USER=ci \
            -e NEXTCLOUD_ADMIN_PASSWORD=ci-password-1 \
            nextcloud:latest
          # Installation is what takes the time, not the port opening, so the
          # wait is on status.php reporting installed rather than on a socket.
          for _ in $(seq 1 120); do
            curl -s http://127.0.0.1:8081/status.php | grep -q '"installed":true' && break
            sleep 2
          done

      # Baïkal has no unattended install: the wizard is the only supported
      # path, so the job drives it exactly as a browser would — two form posts
      # for config and database, then an admin login and a user. Scripted here
      # rather than baked into an image so the version stays whatever the tag
      # resolves to, and a wizard change breaks the job loudly instead of a
      # stale fixture hiding it.
      - name: Start Baikal
        if: matrix.server == 'baikal'
        run: |
          docker run -d --name pim-baikal -p 127.0.0.1:8082:80 ckulka/baikal:nginx
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:8082/ && break
            sleep 2
          done
          jar=$(mktemp)
          token() { grep -oE 'name="CSRF_TOKEN" value="[^"]+"' "$1" | head -1 | sed 's/.*value="//;s/"//'; }

          curl -s -c "$jar" http://127.0.0.1:8082/admin/install/ -o /tmp/bk1.html
          curl -s -b "$jar" -c "$jar" -X POST http://127.0.0.1:8082/admin/install/ -o /dev/null \
            --data-urlencode "CSRF_TOKEN=$(token /tmp/bk1.html)" \
            --data-urlencode "Baikal_Model_Config_Standard::submitted=1" \
            --data-urlencode "refreshed=0" \
            --data-urlencode "data[timezone]=UTC" \
            --data-urlencode "data[card_enabled]=1" \
            --data-urlencode "data[cal_enabled]=1" \
            --data-urlencode "data[invite_from]=ci@example.com" \
            --data-urlencode "data[dav_auth_type]=Basic" \
            --data-urlencode "data[admin_passwordhash]=ci-password-1" \
            --data-urlencode "data[admin_passwordhash_confirm]=ci-password-1" \
            --data-urlencode "witness[timezone]=1" --data-urlencode "witness[card_enabled]=1" \
            --data-urlencode "witness[cal_enabled]=1" --data-urlencode "witness[invite_from]=1" \
            --data-urlencode "witness[dav_auth_type]=1" \
            --data-urlencode "witness[admin_passwordhash]=1" \
            --data-urlencode "witness[admin_passwordhash_confirm]=1"

          curl -sL -b "$jar" -c "$jar" http://127.0.0.1:8082/admin/install/ -o /tmp/bk2.html
          curl -s -b "$jar" -c "$jar" -X POST http://127.0.0.1:8082/admin/install/ -o /dev/null \
            --data-urlencode "CSRF_TOKEN=$(token /tmp/bk2.html)" \
            --data-urlencode "Baikal_Model_Config_Database::submitted=1" \
            --data-urlencode "refreshed=0" \
            --data-urlencode "data[backend]=sqlite" \
            --data-urlencode "data[sqlite_file]=/var/www/baikal/Specific/db/db.sqlite" \
            --data-urlencode "witness[backend]=1" --data-urlencode "witness[sqlite_file]=1"

          curl -sL -b "$jar" -c "$jar" -X POST http://127.0.0.1:8082/admin/ -o /dev/null \
            -d "auth=1" -d "login=admin" -d "password=ci-password-1"
          curl -sL -b "$jar" -c "$jar" "http://127.0.0.1:8082/admin/?/users/new/1/" -o /tmp/bk3.html
          curl -s -b "$jar" -c "$jar" -X POST "http://127.0.0.1:8082/admin/?/users/new/1/" -o /dev/null \
            --data-urlencode "CSRF_TOKEN=$(token /tmp/bk3.html)" \
            --data-urlencode "Baikal_Model_User::submitted=1" \
            --data-urlencode "refreshed=0" \
            --data-urlencode "data[username]=ci" \
            --data-urlencode "data[displayname]=CI" \
            --data-urlencode "data[email]=ci@example.com" \
            --data-urlencode "data[password]=ci-password-1" \
            --data-urlencode "data[passwordconfirm]=ci-password-1" \
            --data-urlencode "witness[username]=1" --data-urlencode "witness[displayname]=1" \
            --data-urlencode "witness[email]=1" --data-urlencode "witness[password]=1" \
            --data-urlencode "witness[passwordconfirm]=1"

          # The wizard is silent about failure, so prove the account works
          # before the journey blames the client for a provisioning slip.
          code=$(curl -s -o /dev/null -w '%{http_code}' -u ci:ci-password-1 \
            -X PROPFIND -H 'Depth: 0' http://127.0.0.1:8082/dav.php/)
          test "$code" = "207" || { echo "Baikal provisioning failed: PROPFIND $code"; exit 1; }

      - name: Live round trip
        env:
          COSMIC_PIM_LIVE_CALDAV_URL: ${{ matrix.url }}
          COSMIC_PIM_LIVE_CALDAV_USER: ${{ matrix.user }}
          COSMIC_PIM_LIVE_CALDAV_PASS: ${{ matrix.pass }}
          COSMIC_PIM_LIVE_CALDAV_EXPECT: ${{ matrix.expect }}
        run: cargo test -p cosmic-pim-caldav --test live_server -- --ignored

      - name: Server log on failure
        if: failure() && matrix.server == 'nextcloud'
        run: docker logs pim-nextcloud | tail -100

      - name: Server log on failure
        if: failure() && matrix.server == 'baikal'
        run: docker logs pim-baikal | tail -100

  # The IMAP half of the same argument: the real client against a stock
  # Dovecot, not our own canned responses. Its first local run found two real
  # bugs (CONDSTORE advertised-but-never-enabled; the mass-delete guard
  # wedging a genuine 1→0), which settles whether the job earns its minutes.
  # The tests skip silently without PIM_TEST_IMAP, so this job is the only
  # place they actually gate anything. Exchange, Gmail-IMAP, and the rest of
  # the zoo need real credentials and stay out of shared CI; the quirks table
  # records what each run of those finds.
  live-imap:
    name: live IMAP (dovecot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Start Dovecot
        run: |
          docker run -d --name pim-dovecot -p 14143:31143 \
            -e USER_PASSWORD=hunter2 \
            -v "$PWD/crates/cosmic-pim-mail/tests/dovecot.conf:/etc/dovecot/dovecot.conf:ro" \
            dovecot/dovecot:latest
          for _ in $(seq 1 100); do
            (exec 3<>/dev/tcp/127.0.0.1/14143) 2>/dev/null && exec 3>&- && break
            sleep 0.2
          done

      - name: Live round trip, IDLE, QRESYNC
        env:
          PIM_TEST_IMAP: 127.0.0.1:14143:tester:hunter2
        run: cargo test -p cosmic-pim-mail --test live_dovecot -- --nocapture

      - name: Server log on failure
        if: failure()
        run: docker logs pim-dovecot | tail -100

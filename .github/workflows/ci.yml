# The gate the justfile's recipes imply, run on shared runners. The toolchain
# comes from rust-toolchain.toml — the workflow deliberately passes none, per
# the ecosystem convention, so a bump there is a bump everywhere at once.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml on the first cargo invocation and
      # installs the pinned channel with its components. No toolchain action
      # needed, and none wanted: an action pinning its own default would
      # silently override the file.
      - name: Show the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      # Warnings as-is (the workspace's own lint tables gate the build);
      # pedantic stays advisory, as everywhere in the COSMIC ecosystem.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Tests
        run: cargo test --workspace --locked

  # The server matrix 00-suite.md asks for: the real sync engine against real
  # CalDAV servers, exercising discovery, MKCALENDAR, listing, multiget,
  # writeback, the 412 path and guarded deletes against something nobody
  # canned. Two independent codebases already; Baïkal and Nextcloud can join
  # as containers later. The journey each job runs has been validated locally
  # against both servers before ever reaching CI.
  live-caldav:
    name: live CalDAV (${{ matrix.server }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: radicale
            url: http://127.0.0.1:5232/ci/
            user: ci
            pass: ci
          - server: xandikos
            url: http://127.0.0.1:5233/ci/
            user: ""
            pass: ""
    steps:
      - uses: actions/checkout@v4
      - name: Show the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Start Radicale
        if: matrix.server == 'radicale'
        run: |
          pipx install radicale
          mkdir -p /tmp/radicale
          cat > /tmp/radicale.conf <<'EOF'
          [server]
          hosts = 127.0.0.1:5232
          [auth]
          type = none
          [storage]
          filesystem_folder = /tmp/radicale
          [rights]
          type = owner_only
          EOF
          radicale --config /tmp/radicale.conf &
          for _ in $(seq 1 50); do
            curl -s -o /dev/null http://127.0.0.1:5232/ && break
            sleep 0.2
          done

      - name: Start Xandikos
        if: matrix.server == 'xandikos'
        run: |
          pipx install xandikos
          mkdir -p /tmp/xandikos
          xandikos -d /tmp/xandikos --autocreate -l 127.0.0.1 -p 5233 \
            --current-user-principal=/ci/ &
          for _ in $(seq 1 50); do
            curl -s -o /dev/null http://127.0.0.1:5233/ && break
            sleep 0.2
          done

      - name: Live round trip
        env:
          COSMIC_PIM_LIVE_CALDAV_URL: ${{ matrix.url }}
          COSMIC_PIM_LIVE_CALDAV_USER: ${{ matrix.user }}
          COSMIC_PIM_LIVE_CALDAV_PASS: ${{ matrix.pass }}
        run: cargo test -p cosmic-pim-caldav --test live_server -- --ignored
